<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>Sinh nhật Em yêu ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    /* Trang chính - hồng ngọt */
    --pink-1:#fff5f8;
    --pink-2:#ffe3ec;
    --pink-3:#ffc2d6;
    --rose:#ff7aa2;
    --rose-deep:#e85d84;
    --plum:#7a3b52;
    --cream:#fffafc;
    --bal-yellow:#ffdf8a;
    --bal-mint:#a9ecd8;
    --bal-purple:#d6bdfa;
    /* Intro - xanh đêm */
    --night-1:#050914;
    --night-2:#0a1430;
    --star:#cfe0ff;
    --glow:#6ea8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;overscroll-behavior-y:none;background:var(--night-1);}
  body{font-family:'Quicksand',sans-serif;color:var(--plum);background:var(--night-1);}

  /* ---------- INTRO ---------- */
  #intro{
    position:fixed;inset:0;z-index:100;
    background:radial-gradient(ellipse at 50% 40%, var(--night-2), var(--night-1) 70%);
    overflow:hidden;cursor:grab;transition:opacity 1.2s ease;
  }
  #intro.grabbing{cursor:grabbing;}
  #intro canvas{display:block;}
  .intro-hint{
    position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
    color:var(--star);font-size:clamp(14px,3.6vw,18px);letter-spacing:.5px;
    text-align:center;width:90%;pointer-events:none;
    text-shadow:0 0 16px rgba(110,168,255,.6);
    animation:hintPulse 2.6s ease-in-out infinite;
  }
  @keyframes hintPulse{0%,100%{opacity:.45}50%{opacity:1}}
  .intro-title{
    position:absolute;top:8%;left:50%;transform:translateX(-50%);
    text-align:center;width:92%;pointer-events:none;color:#dbe7ff;
    font-family:'Playfair Display',serif;font-style:italic;
    font-size:clamp(20px,5.5vw,34px);text-shadow:0 0 24px rgba(110,168,255,.5);
    opacity:.9;
  }
  #enterFlash{
    position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
    transition:opacity .5s ease;
  }

  /* ---------- WARP OVERLAY ---------- */
  #warp{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%, #ffd9e6 0%, #ff9dbd 40%, transparent 72%);
    transition:opacity .6s ease;}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<!-- ================= INTRO ================= -->
<div id="intro">
  <div class="intro-title">Có một điều bất ngờ đang chờ em giữa những vì sao...</div>
  <div class="intro-hint">✨ Chạm và kéo để xoay không gian &middot; tìm ngôi sao đặc biệt nhất để bước vào 💫</div>
  <div id="enterFlash"></div>
</div>
<div id="warp"></div>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- INTRO: KHÔNG GIAN 3D ---------- */
/* ---------- INTRO: KHÔNG GIAN 3D ---------- */
(function(){
  const introEl = document.getElementById('intro');
  const flash = document.getElementById('enterFlash');
  const isMobile = window.matchMedia('(max-width:640px)').matches;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050914, 0.0009);
  const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 2000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x050914, 1);
  introEl.appendChild(renderer.domElement);

  // Sao
  const starCount = isMobile ? 2200 : 5000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(starCount*3);
  const col = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r = 300 + Math.random()*600;
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t);
    pos[i*3+1]=r*Math.sin(p)*Math.sin(t);
    pos[i*3+2]=r*Math.cos(p);
    const c = 0.6+Math.random()*0.4;
    col[i*3]=c*0.8; col[i*3+1]=c*0.9; col[i*3+2]=1;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    size:2.2, vertexColors:true, transparent:true, opacity:.9,
    sizeAttenuation:true, blending:THREE.AdditiveBlending
  }));
  scene.add(stars);

  // HỆ MẶT TRỜI (đặt phía xa để làm khung cảnh)
  const solar = new THREE.Group();
  solar.position.set(-120, 60, -520);
  scene.add(solar);

  // Mặt trời phát sáng
  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(48,32,32),
    new THREE.MeshBasicMaterial({color:0xffd27a})
  );
  solar.add(sun);
  // hào quang mặt trời
  const sunGlow = new THREE.Mesh(
    new THREE.SphereGeometry(72,32,32),
    new THREE.MeshBasicMaterial({color:0xffb347, transparent:true, opacity:.25, blending:THREE.AdditiveBlending})
  );
  const sunGlow2 = new THREE.Mesh(
    new THREE.SphereGeometry(110,32,32),
    new THREE.MeshBasicMaterial({color:0xff8c3b, transparent:true, opacity:.12, blending:THREE.AdditiveBlending})
  );
  solar.add(sunGlow, sunGlow2);

  // Các hành tinh: [bán kính quỹ đạo, kích thước, màu, tốc độ, độ nghiêng quỹ đạo, màu vành]
  const planetDefs = [
    [95,  6,  0x9fa6b2, 0.9,  0.15, null],       // Sao Thủy
    [135, 10, 0xe8b06a, 0.65, 0.05, null],       // Sao Kim
    [180, 11, 0x5b8def, 0.5,  0.0,  null],       // Trái Đất
    [225, 8,  0xd66a4a, 0.42, 0.1,  null],       // Sao Hỏa
    [300, 22, 0xc97b4a, 0.28, 0.08, null],       // Sao Mộc
    [370, 18, 0xf0d59a, 0.2,  0.2,  0xf5e6b8],   // Sao Thổ (có vành)
  ];
  const planets = [];
  planetDefs.forEach(([orbit,size,color,speed,tilt,ringColor])=>{
    // vòng quỹ đạo mờ
    const ringGeo = new THREE.RingGeometry(orbit-0.4, orbit+0.4, 96);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color:0x6a7fb0, transparent:true, opacity:.18, side:THREE.DoubleSide
    }));
    ring.rotation.x = Math.PI/2 + tilt;
    solar.add(ring);

    const pivot = new THREE.Group();
    pivot.rotation.x = tilt;
    const planet = new THREE.Mesh(
      new THREE.SphereGeometry(size,24,24),
      new THREE.MeshBasicMaterial({color})
    );
    planet.position.x = orbit;
    // vành đai (Sao Thổ)
    if(ringColor){
      const pRing = new THREE.Mesh(
        new THREE.RingGeometry(size*1.4, size*2.3, 48),
        new THREE.MeshBasicMaterial({color:ringColor, transparent:true, opacity:.55, side:THREE.DoubleSide})
      );
      pRing.rotation.x = Math.PI/2.6;
      planet.add(pRing);
    }
    pivot.add(planet);
    solar.add(pivot);
    planets.push({pivot, speed, phase:Math.random()*Math.PI*2});
  });

  // NGÔI SAO ĐẶC BIỆT = nút vào trang (đặt lệch hướng để phải xoay tìm)
  const enterGroup = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(14,32,32),
    new THREE.MeshBasicMaterial({color:0xfff0f6})
  );
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(30,32,32),
    new THREE.MeshBasicMaterial({color:0xff9ec4, transparent:true, opacity:.35, blending:THREE.AdditiveBlending})
  );
  const halo2 = new THREE.Mesh(
    new THREE.SphereGeometry(50,32,32),
    new THREE.MeshBasicMaterial({color:0xff5c8a, transparent:true, opacity:.14, blending:THREE.AdditiveBlending})
  );
  enterGroup.add(core,halo,halo2);
  // vị trí lệch phía sau-phải-dưới
  enterGroup.position.set(180, -60, 260);
  scene.add(enterGroup);

  // HTML label cho ngôi sao đặc biệt
  const label = document.createElement('div');
  label.textContent = '💖 16-08-2026';
  Object.assign(label.style,{
    position:'absolute', color:'#fff', fontFamily:'Quicksand,sans-serif',
    fontWeight:'700', fontSize:'15px', padding:'8px 16px', borderRadius:'30px',
    background:'rgba(255,92,138,.55)', border:'1px solid rgba(255,255,255,.6)',
    backdropFilter:'blur(4px)', transform:'translate(-50%,-140%)', whiteSpace:'nowrap',
    pointerEvents:'none', textShadow:'0 0 10px rgba(255,120,160,.8)', display:'none',
    boxShadow:'0 0 30px rgba(255,92,138,.6)', zIndex:5
  });
  introEl.appendChild(label);

  // Điều khiển xoay (drag + touch)
  let rotY=0, rotX=0, targetY=0, targetX=0, dragging=false, lastX,lastY, moved=0;
  function down(x,y){dragging=true;lastX=x;lastY=y;moved=0;introEl.classList.add('grabbing');}
  function move(x,y){
    if(!dragging)return;
    const dx=x-lastX, dy=y-lastY; lastX=x;lastY=y; moved+=Math.abs(dx)+Math.abs(dy);
    targetY += dx*0.005; targetX += dy*0.005;
    targetX=Math.max(-1.1,Math.min(1.1,targetX));
  }
  function up(){dragging=false;introEl.classList.remove('grabbing');}
  introEl.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
  addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  addEventListener('mouseup',up);
  introEl.addEventListener('touchstart',e=>down(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  introEl.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  introEl.addEventListener('touchend',up);

  // Bấm để vào
  const raycaster = new THREE.Raycaster();
  function tryEnter(x,y){
    if(moved>12) return; // đang kéo thì bỏ qua
    const mouse = new THREE.Vector2((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
    raycaster.setFromCamera(mouse,camera);
    const hits = raycaster.intersectObjects([core,halo,halo2],true);
    if(hits.length) enterMain();
  }
  introEl.addEventListener('click',e=>tryEnter(e.clientX,e.clientY));
  introEl.addEventListener('touchend',e=>{
    if(e.changedTouches.length) tryEnter(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
  });

  let entered=false;
  function enterMain(){
    if(entered)return; entered=true;
    document.getElementById('warp').style.opacity='1';
    flash.style.opacity='1';
    setTimeout(()=>{
      window.location.href='16-08-2026/index.html';
    },650);
  }

  // Render loop
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if(!dragging){ targetY += 0.0004; } // tự trôi nhẹ
    rotY += (targetY-rotY)*0.06;
    rotX += (targetX-rotX)*0.06;
    camera.position.x = Math.sin(rotY)*10;
    camera.rotation.y = rotY;
    camera.rotation.x = rotX;
    stars.rotation.y = t*0.01;
    // Hệ mặt trời: mặt trời tự quay + hành tinh quay quanh
    sun.rotation.y = t*0.15;
    solar.rotation.y = t*0.02;
    planets.forEach(p=>{ p.pivot.rotation.y = p.phase + t*p.speed*0.35; });

    const pulse = 1+Math.sin(t*2)*0.08;
    enterGroup.scale.set(pulse,pulse,pulse);

    // Cập nhật label khi ngôi sao trong tầm nhìn
    const v = enterGroup.position.clone().project(camera);
    const visible = v.z<1 && v.x>-1 && v.x<1 && v.y>-1 && v.y<1;
    if(visible){
      label.style.display='block';
      label.style.left = ((v.x*0.5+0.5)*innerWidth)+'px';
      label.style.top  = ((-v.y*0.5+0.5)*innerHeight)+'px';
    } else label.style.display='none';

    renderer.render(scene,camera);
  }
  animate();
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
